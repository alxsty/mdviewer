name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - dev

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          ref: main
          path: stable-src

      - name: Checkout dev branch
        uses: actions/checkout@v6
        with:
          ref: dev
          path: dev-src

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            stable-src/package-lock.json
            dev-src/package-lock.json

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Build stable version
        shell: bash
        run: |
          cd stable-src
          npm ci --no-audit --no-fund
          npm run build:pages

          mkdir -p ../site
          cp -R dist/. ../site/

      - name: Build dev version
        shell: bash
        run: |
          cd dev-src
          npm ci --no-audit --no-fund
          npm run build:pages:dev

          mkdir -p ../site/dev
          cp -R dist/. ../site/dev/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
